[tool.poetry]
name = "retail-ai-chatbot"
version = "0.1.0"
description = "AI-powered retail assistant chatbot with FastAPI backend and Streamlit UI"
authors = ["Your Name <you@example.com>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
# Core Framework
fastapi = "^0.116.1"
uvicorn = {extras = ["standard"], version = "^0.30.0"}
pydantic = "^2.11.7"
pydantic-settings = "^2.10.1"

# LLM & AI
langchain-groq = ">=0.2.0"
langchain-core = "^0.3.72"
langchain-community = "^0.3.27"
langchain-text-splitters = "^0.3.9"
langgraph = "^0.6.2"
langgraph-checkpoint = "^2.1.1"
langgraph-prebuilt = "^0.6.2"

# Vector DB & RAG
chromadb = "^1.0.15"

# UI
streamlit = "^1.43.2"
openai-whisper = "^20250625"

# Database & Migrations
alembic = "^1.16.4"

# Monitoring & Logging
mlflow = "^3.1.4"

# Data Processing
pandas = "^2.3.1"
numpy = "^2.2.6"

# Utilities
python-dotenv = "^1.1.1"
requests = "^2.32.4"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-asyncio = "^0.24.0"
pytest-cov = "^6.0.0"
black = "^25.0.0"
ruff = "^0.10.0"
mypy = "^1.14.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
